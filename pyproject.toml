[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsage"
version = "0.1.0"
description = "Agentic RAG assistant built on LangChain, LangGraph, LangSmith, and LangFuse."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DocSage contributors" }]
dependencies = [
    # LangChain 1.x family (pinned to known-good versions after install; see requirements.lock)
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "langsmith>=0.3",
    "langfuse>=2.0",
    # Config
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Required by InMemoryVectorStore's cosine similarity (langchain-core).
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-timeout>=2",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
docsage = "docsage.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not eval' -ra -q"
markers = [
    "integration: requires real API keys and network access (LangSmith/LangFuse/LLM)",
    "eval: runs dataset evaluations against LangSmith and LangFuse",
]
asyncio_mode = "auto"
timeout = 120

[tool.coverage.run]
source = ["docsage"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Allow function calls in defaults where intentional
